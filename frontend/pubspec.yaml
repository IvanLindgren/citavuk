name: srbski_read
description: "Читавук — сербская читалка с разбором слов, грамматикой и карточками."
publish_to: 'none'

version: 1.9.0+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^25.1.37
  archive: ^3.6.1
  xml: ^6.5.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  # БД в вебе (sqlite3 wasm + IndexedDB).
  sqflite_common_ffi_web: ^0.4.0
  # Версия sqlite3 ЗАФИКСИРОВАНА под web/sqlite3.wasm (релиз sqlite3-3.3.2).
  # Если меняешь её — обнови и web/sqlite3.wasm с того же релиза, иначе на вебе
  # будет «WebAssembly.instantiate: Import env» (несовпадение ABI).
  sqlite3: 3.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.2.0
  # sha256 для адресации текста книг при синхронизации. Пакет и раньше приходил
  # транзитивно, но используется теперь напрямую и потому объявлен явно.
  crypto: ^3.0.3
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  # Windows/Android. После добавления: flutter clean + flutter pub get.
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  google_sign_in: ^7.2.0
  # Только для Android: там вход идёт через Custom Tabs и схему citavuk://.
  # На Windows пакет непригоден — он закрывает локальный сервер по событию
  # жизненного цикла, см. services/desktop_oauth_io.dart.
  flutter_web_auth_2: ^5.0.3
  # Возврат окна на передний план после входа в браузере. Приходил транзитивно
  # с flutter_web_auth_2; объявлен явно, потому что используется напрямую.
  window_to_front: ^0.0.4
  desktop_drop: ^0.7.1
  # Чтение файла по пути одинаково на всех платформах, включая веб, где dart:io
  # нет. Приходил транзитивно с desktop_drop; объявлен явно, потому что
  # используется напрямую при импорте книги.
  cross_file: ^0.3.4
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # Брендовые значки соцсетей в окне «Поделиться». Material Icons не содержит
  # Telegram/VK/Viber/Threads, а текстовые кнопки плохо сканировались.
  font_awesome_flutter: ^11.0.0

# path_provider_android 2.3.x тянет нативный плагин `jni`, который ломает сборку
# под Windows. Закрепляем на 2.2.x (без jni); на Android работает штатно.
dependency_overrides:
  path_provider_android: '>=2.2.0 <2.3.0'
  # Windows-часть уведомлений собирается через ATL, которого нет в
  # установленной Visual Studio, и роняла сборку десктопа целиком. Локальная
  # копия — тот же пакет без нативной части: на телефоне уведомления работают,
  # на Windows их и не было.
  flutter_local_notifications_windows:
    path: third_party/flutter_local_notifications_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  inno_bundle: ^0.4.0

flutter_launcher_icons:
  image_path: "assets/imgs/citavuk_icon.png"
  android: true
  ios: false
  web:
    generate: true
    background_color: "#F3E9D2"
    theme_color: "#9E2B25"
  windows:
    generate: true
    icon_size: 256


flutter:
  uses-material-design: true

  assets:
    - assets/lexicon.db
    - assets/test_story.docx
    - assets/test_story.pdf
    # assets/library/ намеренно не входит в сборку: там книги, защищённые
    # авторским правом. Раздел «Бесплатная библиотека» сам скрывается, когда
    # ассетов нет.
    - assets/imgs/
    - assets/course/
    - assets/course/dialogues/
    - assets/animations/generated/
    - assets/sounds/
    # Каталог материалов для поступления. Собирается общим для сайта и
    # приложения скриптом web/scripts/build-materials.py.
    - assets/materials/
    # Тексты и иллюстрации временных событий. Песни «Одиссеи» собираются тем же
    # скриптом, что и для сайта (web/scripts/prepare-odyssey-event.py).
    - assets/events/odyssey/
    - assets/english/

  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700

inno_bundle:
  id: a2cc5770-60d4-11f1-bfd5-31efbcab4b3e
  name: Citavuk
  # Версия дублируется намеренно: inno_bundle не читает её из поля version
  # выше. Правишь version — правь и здесь, иначе установщик уедет со старым
  # номером в имени файла и в «Установке и удалении программ».
  version: 1.9.0
  publisher: Denis Kornilov
  languages:
    - english
    - russian
  executable: build/windows/x64/runner/Release/Citavuk.exe
  icon: assets/imgs/citavuk_icon.png
