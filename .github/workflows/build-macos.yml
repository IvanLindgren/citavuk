name: Build macOS

# Только по кнопке. Сборка идёт на платном macos-раннере и красит main в
# красный из-за проверки ключа, которая на этой платформе пока не разобрана
# (см. задачу про пересборку macOS). Держать её на каждом пуше во frontend
# значит платить за минуты и терять сигнал: красный main перестают читать.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citavuk-macos-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze lib

      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Ключ карты задан
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::error::Нет секрета MAPTILER_KEY — Путешествие соберётся" \
                 "списком мест вместо карты. Задайте секрет репозитория."
            exit 1
          fi

      - name: Build macOS release
        working-directory: frontend
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build macos --release "--dart-define=MAPTILER_KEY=$MAPTILER_KEY"

      - name: Ключ карты попал в сборку
        working-directory: frontend
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          # -R, а не -r: код Dart лежит в App.framework, а тот собран из
          # симлинков, внутрь которых -r не заходит.
          #
          # Результат в переменную, а не через -q: под `set -e` неудачный grep
          # оборвал бы шаг молча, и вместо объяснения мы получили бы голый
          # ненулевой код возврата.
          found=$(grep -aRlF -e "$MAPTILER_KEY" \
            build/macos/Build/Products/Release/ 2>/dev/null | head -n 3 || true)
          if [ -n "$found" ]; then
            echo "ключ на месте:"
            echo "$found"
          else
            echo "::error::В снапшоте macOS нет ключа карты — define потерялся."
            echo "искали здесь:"
            find build/macos/Build/Products/Release -maxdepth 5 | head -n 40
            exit 1
          fi

      - name: Package application
        working-directory: frontend
        run: |
          APP='build/macos/Build/Products/Release/Citavuk.app'
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/citavuk-macos.zip
          shasum -a 256 build/citavuk-macos.zip > build/citavuk-macos.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: citavuk-macos
          path: |
            frontend/build/citavuk-macos.zip
            frontend/build/citavuk-macos.zip.sha256

      - name: Publish rolling beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view macos-latest >/dev/null 2>&1; then
            gh release create macos-latest \
              --target "$GITHUB_SHA" \
              --title 'Citavuk for macOS (beta)' \
              --notes 'Автоматическая beta-сборка без Apple Developer ID и нотарификации.' \
              --prerelease
          fi
          gh release upload macos-latest \
            frontend/build/citavuk-macos.zip \
            frontend/build/citavuk-macos.zip.sha256 \
            --clobber
