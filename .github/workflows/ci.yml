name: Project CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'tools/**'
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'tools/**'
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: citavuk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Production build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citavuk_test
          POSTGRES_PASSWORD: citavuk_test
          POSTGRES_DB: citavuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citavuk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CITAVUK_TEST_DATABASE_URL: postgres://citavuk_test:citavuk_test@localhost:5432/citavuk_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  flutter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib
      - run: flutter test
      - run: flutter build windows --debug

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/main.py backend/news.py backend/urlguard.py backend/ratelimit.py backend/analysis_cache.py
      - run: python -m unittest discover -s backend -p '*test*.py'
