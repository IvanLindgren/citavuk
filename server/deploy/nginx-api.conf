# Конфигурация nginx для api.citavuk.ru.
#
# На сервере уже работают ISPmanager, чужие сайты, почта и DNS, поэтому файл
# кладётся отдельным vhost в conf.d и ничего существующего не трогает: ни
# nginx.conf, ни vhost-ы панели править не нужно.
#
# Здесь только HTTP. Deploy-скрипт сразу просит Certbot дописать TLS — иначе
# nginx отказался бы стартовать, ссылаясь на ещё не существующий файл ключа,
# и вместе с ним легли бы все остальные сайты на этой машине.
#
# Порядок установки:
#   1. A-запись api.citavuk.ru -> <IP вашего сервера>
#   2. scp nginx-api.conf root@server:/etc/nginx/conf.d/citavuk-api.conf
#   3. nginx -t && systemctl reload nginx
#   4. deploy.sh --nginx вызывает certbot и безопасно дописывает TLS/редирект
#
# До шага 4 сервер отвечает только по HTTP. Приложение в это время подключиться
# не сможет и не должно: токен сессии по открытому каналу передавать нельзя.

# Ограничение частоты на уровне nginx — первый рубеж перед приложением.
# Второй рубеж живёт в самом сервисе и считает лимиты по эндпоинтам.
limit_req_zone $binary_remote_addr zone=citavuk_api:10m rate=20r/s;

upstream citavuk_backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.citavuk.ru;

    # Место для проверки Let's Encrypt. Должно оставаться доступным по HTTP,
    # иначе автоматическое продление сертификата перестанет проходить.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Текст книги может весить мегабайты. Верхняя граница чуть выше той, что
    # проверяет приложение, чтобы отказ приходил с внятным сообщением от него,
    # а не голым 413 от nginx.
    client_max_body_size 40m;
    client_body_timeout 300s;

    access_log /var/log/nginx/citavuk-api.access.log;
    error_log  /var/log/nginx/citavuk-api.error.log;

    location / {
        limit_req zone=citavuk_api burst=40 nodelay;

        proxy_pass http://citavuk_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовки CORS проставляет само приложение: оно знает список
        # разрешённых origin. Дублировать их здесь нельзя — браузер отвергает
        # ответ с двумя значениями Access-Control-Allow-Origin.

        # Выгрузка книги на медленной сети идёт долго.
        proxy_connect_timeout 10s;
        proxy_send_timeout    420s;
        proxy_read_timeout    420s;

        # Аудио с верхнего сервиса отдаётся потоком, буферизация его ломает.
        proxy_buffering off;
    }
}
