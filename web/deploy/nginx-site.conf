# Конфигурация nginx для сайта citavuk.ru.
#
# На сервере уже работают ISPmanager, чужие сайты, почта и DNS, поэтому файл
# кладётся отдельным vhost в conf.d и ничего существующего не трогает.
#
# Здесь только HTTP. Блок TLS допишет certbot при выпуске сертификата — иначе
# nginx откажется стартовать, ссылаясь на ещё не существующий ключ, и вместе с
# ним лягут все остальные сайты на этой машине.
#
# Порядок установки:
#   1. A-записи citavuk.ru и www.citavuk.ru -> <IP вашего сервера>
#   2. scp nginx-site.conf root@server:/etc/nginx/conf.d/citavuk-site.conf
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d citavuk.ru -d www.citavuk.ru

server {
    listen 80;
    listen [::]:80;
    server_name citavuk.ru www.citavuk.ru;

    root /var/www/citavuk;
    index index.html;

    # Место для проверки Let's Encrypt. Должно оставаться доступным по HTTP,
    # иначе автоматическое продление сертификата перестанет проходить.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    access_log /var/log/nginx/citavuk-site.access.log;
    error_log  /var/log/nginx/citavuk-site.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain text/css application/javascript text/javascript application/json
        image/svg+xml application/manifest+json;
    # WebP и WOFF2 уже сжаты внутри — повторное сжатие только тратит процессор.

    # У nginx нет .mjs в стандартном mime.types, и worker PDF.js уходил как
    # application/octet-stream — браузер строго проверяет тип модуля и
    # отказывается его исполнять: «Failed to fetch dynamically imported module».
    #
    # Чинится это ТОЛЬКО точечно, через default_type для одного расширения.
    # Блок `types { text/javascript mjs; }` кажется очевиднее, но он ЗАМЕНЯЕТ
    # таблицу типов целиком, а не дополняет её: тогда и index.html уходит как
    # octet-stream, и браузер вместо страницы скачивает файл. Так уже было.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Манифеста нет в mime.types: без явного типа он уходит как
    # application/octet-stream, и браузер его игнорирует — «установить
    # приложение» не предлагается, иконка и цвет темы не подхватываются.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Файлы для поисковиков. Кеш короткий: карта сайта меняется вместе с
    # разделами, и сутки задержки здесь ни к чему.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Установочные файлы приложений.
    #
    # Лежат ВНЕ /var/www/citavuk намеренно: выкатка сайта подменяет этот каталог
    # целиком, и сборки, положенные внутрь, исчезали бы при каждом деплое, а
    # ссылки на них на странице «Скачать» становились бы битыми.
    #
    # Кеш короткий: имя файла постоянное, а содержимое меняется с каждой
    # версией. Годовой immutable, как у /assets/, раздавал бы прошлую сборку
    # ещё год после выхода новой.
    location /files/ {
        alias /var/www/citavuk-files/;
        add_header Cache-Control "public, max-age=300";
        # У .apk в mime.types нет своего типа, и без этой строки он уехал бы
        # как text/plain — браузер показал бы двоичный мусор вместо загрузки.
        # Именно default_type, а не блок `types`: тот заменяет таблицу целиком,
        # и одна такая правка уже роняла сайт (см. комментарий про .mjs ниже).
        default_type application/octet-stream;
        autoindex off;
        try_files $uri =404;
    }

    # Файлы сборки содержат хеш содержимого в имени, поэтому меняются только
    # вместе с именем. Их можно кешировать «навсегда».
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(woff2|webp|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html кешировать нельзя: именно он указывает на актуальные бандлы,
    # и закешированный старый вариант будет вечно тянуть уже удалённые файлы.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Одностраничное приложение: маршрутизацию выполняет сам сайт, поэтому
    # любой неизвестный путь обязан отдавать index.html, а не 404. Иначе
    # обновление страницы на /library сломает переход по прямой ссылке.
    #
    # Каталога в try_files намеренно НЕТ. С `$uri/` любая папка внутри сборки
    # перекрывает одноимённый маршрут: рядом лежит /course/ с материалами курса,
    # и переход на страницу /course отдавал 301 на /course/, а затем 403 —
    # список файлов выключен, отдавать нечего. Ассеты курса запрашиваются
    # полными путями (/course/course_bundle.json), их обслуживает первая ветка
    # `$uri`, а сам каталог наружу не нужен.
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
